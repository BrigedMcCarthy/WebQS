<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Created with Microsoft FrontPage 3.0 -->
  <!-- ============================================
       ProtoWebchat(tm) - 1999
       Best viewed at 800x600 resolution
       ============================================ -->
  <title>ProtoWebchat - Send Message</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #c0c0c0; font-family: Arial, Helvetica, sans-serif; color: #000; font-size: 14px; }
    body::before { content: "ProtoWebchat - Send Message"; display: block; background: #c0c0c0; color: #000; padding: 10px; text-align: center; font-weight: bold; font-size: 14px; border-bottom: 2px outset #dfdfdf; }
    .window { width: 90%; max-width: 600px; margin: 15px auto; padding: 10px; background: #c0c0c0; border: 3px outset #dfdfdf; }
    h2 { color: #000; font-size: 14px; margin: 8px 0; font-weight: bold; }
    .field-group { margin: 8px 0; padding: 8px; background: #c0c0c0; border: 2px outset #dfdfdf; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #000; font-size: 12px; }
    select, textarea, input { background-color: #fff; color: #000; border: 2px inset #dfdfdf; padding: 4px; font-family: inherit; font-size: 12px; width: 100%; box-sizing: border-box; }
    textarea { resize: vertical; min-height: 100px; }
    button { background: #c0c0c0; color: #000; border: 2px outset #dfdfdf; padding: 4px 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    button:active { border-style: inset; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .button-row { margin: 8px 0; display: flex; gap: 4px; }
    .status { margin: 8px 0; padding: 6px; border: 2px solid #000; display: none; font-weight: bold; text-align: center; font-size: 12px; }
    .status.success { background-color: #c0c0c0; color: #000; display: block; border-color: #008000; }
    .status.error { background-color: #c0c0c0; color: #c62828; display: block; border-color: #ff0000; }
    .info-box { background-color: #c0c0c0; border: 2px inset #dfdfdf; padding: 8px; margin: 8px 0; font-size: 12px; line-height: 1.5; color: #000; }
    .status-bar { border-top: 2px outset #dfdfdf; padding: 4px 8px; font-size: 11px; color: #000; display: flex; justify-content: space-between; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">Message Send Center</div>
    
    <div class="field-group">
      <h2>New Message</h2>
      <label>Send To:</label>
      <select id="user">
        <option value="1">User 1</option>
        <option value="2">User 2</option>
      </select>
      <label style="margin-top:8px">Template:</label>
      <select id="templateSelect">
        <option value="">(none)</option>
        <option value="Hello! How are you?">Greeting</option>
        <option value="On my way.">On My Way</option>
        <option value="BRB - busy now.">BRB</option>
      </select>
    </div>
    
    <div class="field-group">
      <label>Message:</label>
      <textarea id="message" placeholder="Type message..." maxlength="500"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:#000;font-size:12px">
        <div>Chars: <span id="charCount">0</span>/500</div>
        <div style="display:flex;gap:4px">
          <button id="undoLast">Undo</button>
          <button id="downloadJSON">DL JSON</button>
          <button id="importJSON">Import</button>
        </div>
      </div>
    </div>
    
    <div class="button-row">
      <button id="send">Send</button>
    </div>
    
    <div id="status" class="status"></div>
    
    <div id="lastSent" class="info-box">Last sent: (none)</div>
    <div class="info-box">
      <strong>Instructions</strong><br>
      • Select which user to send to<br>
      • Type your message<br>
      • Click SEND or press Ctrl+Enter<br>
      • Check the monitor to see replies!
    </div>
    
    <div class="status-bar">ProtoWebchat™ 1.0 | Status: Ready | 1999</div>
  </div>

  <script>
    // Elements: fetch important DOM nodes once
    const userSelect = document.getElementById('user');
    const messageTextarea = document.getElementById('message');
    const sendBtn = document.getElementById('send');
    const statusDiv = document.getElementById('status');
    const templateSelect = document.getElementById('templateSelect');
    const charCount = document.getElementById('charCount');
    const undoLastBtn = document.getElementById('undoLast');
    const downloadJSONBtn = document.getElementById('downloadJSON');
    // copyLastSent button was removed from the HTML in a previous cleanup; try to grab it if present
    const copyLastSentBtn = document.getElementById('copyLastSent');

    messageTextarea.focus();

    // Auto-save draft to localStorage (save every 500ms)
    let autoSaveTimer;
    messageTextarea.addEventListener('input', ()=>{
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(()=>{ localStorage.setItem('pw_draft_' + userSelect.value, messageTextarea.value); }, 500);
    });
    // Note: drafts are stored per-recipient key `pw_draft_<user>` so switching the "Send To" select
    // restores the correct draft for that user.

    // Load draft on user select change
    userSelect.addEventListener('change', ()=>{
      const draft = localStorage.getItem('pw_draft_' + userSelect.value) || '';
      messageTextarea.value = draft; updateCharCount();
    });

    // Load initial draft
    const initialDraft = localStorage.getItem('pw_draft_' + userSelect.value);
    if(initialDraft) messageTextarea.value = initialDraft;

    // templates
    templateSelect.addEventListener('change', ()=>{
      if(templateSelect.value) { messageTextarea.value = templateSelect.value; updateCharCount(); }
    });

    // char counter and limit warning
    function updateCharCount(){ charCount.textContent = messageTextarea.value.length; }
    messageTextarea.addEventListener('input', updateCharCount);
    updateCharCount();

    // keyboard shortcut to focus message (Ctrl+M)
    document.addEventListener('keydown', (e)=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='m'){ e.preventDefault(); messageTextarea.focus(); } });

    // undo last: restore last-sent preview back to textarea
    undoLastBtn.addEventListener('click', ()=>{
      const last = document.getElementById('lastSent').textContent || '';
      if(!last || last.includes('(none)')) return alert('No last message to restore');
      // strip timestamp and "— To User X: " prefix
      const parts = last.split('—');
      const msgPart = parts.length>1 ? parts[1].replace(/^\s*To User \d+:\s*/,'') : last;
      messageTextarea.value = msgPart.trim(); updateCharCount(); messageTextarea.focus();
    });

    // download both user logs as JSON
    downloadJSONBtn.addEventListener('click', async ()=>{
      try{
        const r1 = await fetch('user1.txt', { cache:'no-store' }); const t1 = r1.ok ? await r1.text() : '';
        const r2 = await fetch('user2.txt', { cache:'no-store' }); const t2 = r2.ok ? await r2.text() : '';
        const data = { user1: t1, user2: t2, exported: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='protochat_export.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      }catch(e){ alert('Failed to download logs: '+e.message); }
    });

    // Copy last-sent text to clipboard (only if the button exists)
    if (copyLastSentBtn) {
      copyLastSentBtn.addEventListener('click', ()=>{
        const last = document.getElementById('lastSent').textContent || '';
        if(!last || last.includes('(none)')) return alert('No last message to copy');
        navigator.clipboard.writeText(last).then(()=>alert('Copied')).catch(()=>alert('Copy failed'));
      });
    }

    // Import JSON functionality
    // Import local JSON export - client-side fallback
    document.getElementById('importJSON').addEventListener('click', ()=>{
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const text = await file.text();
        let data;
        try{
          data = JSON.parse(text);
        }catch(parseErr){
          return alert('Invalid JSON file');
        }
        // We cannot write server-side files from the browser; instead, offer to paste imported content into the message box
        const combined = ((data.user1 || '') + '\n' + (data.user2 || '')).trim();
        if(!combined) return alert('No chat content found in file');
        if(confirm('Import will place the exported chat into your message box so you can send or copy it. Continue?')){
          messageTextarea.value = combined + '\n[Imported]\n';
          updateCharCount();
          alert('Imported into message box (not saved to server).');
        }
      };
      input.click();
    });

    // Request desktop notification permission on load
    if('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    // Helper to send desktop notification (wraps the Web Notifications API)
    // This is optional and will only fire if the user granted permission.
    function notifyDesktop(title, msg) {
      if('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, { body: msg, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="%230b5ea8"/></svg>' });
        } catch(e) { /* swallow errors for older browsers */ }
      }
    }

    // Send button: collect form data, post to server and update UI on success/failure
    sendBtn.addEventListener('click', async () => {
      const user = userSelect.value;
      const message = messageTextarea.value.trim();

      if (!message) {
        showStatus('Please enter a message', 'error');
        return;
      }

        try {
          const response = await fetch('/save-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, message })
          });

          // Be tolerant of empty or non-JSON responses to avoid 'Unexpected end of JSON input'
          let result = {};
          try {
            const text = await response.text();
            result = text ? JSON.parse(text) : {};
          } catch (parseErr) {
            // ignore parse error, keep result as empty object
            result = {};
          }

          if (!response.ok) {
            throw new Error(result.error || `Failed to send message (status ${response.status})`);
          }

          showStatus('Message sent to User ' + user, 'success');
          // Update last-sent preview
          const ts = new Date().toLocaleTimeString();
          const last = document.getElementById('lastSent');
          if(last) last.textContent = `${ts} — To User ${user}: ${message}`;
          messageTextarea.value = '';
        localStorage.setItem('pw_draft_' + user, '');
        messageTextarea.focus();
        // Desktop notification
        notifyDesktop('ProtoWebchat', 'Message sent to User ' + user);
        } catch (err) {
          showStatus('Error: ' + err.message, 'error');
        }
    });

    messageTextarea.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'Enter') {
          sendBtn.click();
        }
      }
    });

    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = 'status ' + type;
      
      if (type === 'success') {
        setTimeout(() => {
          statusDiv.className = 'status';
        }, 3000);
      }
    }
  </script>
  <!-- Created with Microsoft FrontPage 3.0 - ProtoWebchat(tm) 1999 -->
</body>
</html>
