  <title>ProtoWebchat - Chat System</title>
  <style>
    * { margin: 0; padding: 0; }
    
    body {
      background: repeating-linear-gradient(45deg, #ffff00, #ffff00 10px, #000080 10px, #000080 20px);
      font-family: Comic Sans MS, Verdana, sans-serif;
      font-size: 12px;
      color: #000000;
      overflow-x: hidden;
    }
    
    body::before {
      content: "★★★ WELCOME TO ProtoWebchat ™ CREATED WITH FRONTPAGE 98 ★★★";
      display: block;
      background: #ff0000;
      color: #ffff00;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      border: 4px solid #008000;
      border-style: ridge;
      animation: blink 0.5s infinite;
    }
    
    body::after {
      content: "You are visitor #" counter(visitors) " | Best viewed in Internet Explorer 5.0 | 800x600 Resolution | © 1999 ProtoWebchat™";
      display: block;
      background: #008080;
      color: #ffff00;
      padding: 6px;
      text-align: center;
      font-size: 11px;
      border: 3px solid #ff0000;
      margin-top: 20px;
    }
    
    .window {
      max-width: 700px;
      margin: 15px auto;
      padding: 10px;
      background: repeating-linear-gradient(90deg, #c0c0c0, #c0c0c0 20px, #ffffff 20px, #ffffff 22px);
      border: 8px ridge;
      border-color: #dfdfdf #808080 #808080 #dfdfdf;
    }
    
    .title-bar {
      background: linear-gradient(to right, #000080, #0000ff, #000080);
      color: #ffff00;
      padding: 4px 8px;
      font-weight: bold;
      font-size: 14px;
      margin: -10px -10px 10px -10px;
      text-align: center;
      border-bottom: 4px outset #c0c0c0;
      animation: blink 1s infinite;
    }
    
    h1, h2 {
      color: #ff0000;
      font-size: 20px;
      text-shadow: 2px 2px #008000;
      margin: 10px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    h3 {
      color: #0000ff;
      font-size: 16px;
      margin: 12px 0 8px 0;
      text-decoration: underline;
      background: #ffff00;
      padding: 4px;
      border: 2px solid #000000;
    }
    
    p {
      margin: 8px 0;
      line-height: 1.6;
      background: #ffffff;
      padding: 6px;
      border: 2px inset #c0c0c0;
    }
    
    .field-group {
      margin: 10px 0;
      padding: 8px;
      background: #c0c0c0;
      border: 3px outset #dfdfdf;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #000080;
      text-transform: uppercase;
      font-size: 11px;
    }
    
    select {
      background-color: #00ffff;
      color: #000000;
      border: 3px outset #dfdfdf;
      padding: 4px;
      font-family: Comic Sans MS, Verdana;
      font-size: 11px;
      width: 100%;
      box-sizing: border-box;
      font-weight: bold;
    }
    
    button {
      background: linear-gradient(to bottom, #ffff00, #ff8000);

      font-weight: bold;

    button:active {
      border-style: inset;

    button:disabled {

    .button-row {

    pre {

      font-size: 11px;

      word-wrap: break-word;
      margin: 8px 0;
      min-height: 60px;
      text-shadow: 0 0 8px #00ff00;
    }
    
    .status-bar {
      background: linear-gradient(to right, #008080, #00ffff);
      border-top: 3px ridge #c0c0c0;

      justify-content: space-between;

    .section {
      margin: 12px 0;

    ul {
      margin: 8px 0 8px 24px;
      padding: 8px;
      background: #ffff00;
      border: 3px double #000000;
    }
    
    li {
      margin: 6px 0;

    a {
      color: #0000ff;
      text-decoration: underline;
      font-weight: bold;
    }
    
    a:visited {
      color: #800080;

    a:hover {
      background: #ffff00;

    }
    
    code {
      background: #ffff00;
      border: 2px solid #000080;
      padding: 2px 4px;
      font-family: Courier New, monospace;
      color: #ff0000;
      font-weight: bold;
    }
    
    .spacer {
      height: 15px;
      background: repeating-linear-gradient(90deg, #ff0000, #ff0000 8px, #00ff00 8px, #00ff00 16px, #0000ff 16px, #0000ff 24px, #ffff00 24px, #ffff00 32px);
      border: 3px solid #000000;
      margin: 15px 0;
    }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

<body>
  <div class="window">
    <div class="title-bar">📧 ProtoWebchat™ Chat Monitor 📧</div>
    
    <div class="section">
      <h1>📧 LIVE CHAT MONITOR 🔴 CONNECTED 🔴</h1>
      
      <div class="field-group">
        <label>👤 USER 1 MESSAGE OUTPUT:</label>
        <pre id="output">(waiting for messages...)</pre>
      </div>
      
      <div class="field-group">
        <label>👥 USER 2 MESSAGE OUTPUT:</label>
        <pre id="output2">(waiting for messages...)</pre>
      </div>
    </div>
    
    <div class="spacer"></div>
    
    <h3>⚡ CONNECTION MODE:</h3>
    <div class="field-group">
      <select id="mode">
        <option value="poll">📧 Polling (HTTP Refresh)</option>
        <option value="sse">📡 Server Events</option>
        <option value="ws">🌐 WebSocket</option>
      </select>
    </div>
    
    <div class="button-row">
      <button id="start">▶️ START CHAT</button>
      <button id="stop" disabled>⏹️ STOP</button>
    </div>
    
    <div class="spacer"></div>
    
    <div class="section">
      <h3>💬 NAVIGATION</h3>
      <ul>
        <li><a href="index.html">📋 Chat Monitor</a></li>
        <li><a href="chat.html">✏️ Send Messages</a></li>
      </ul>
    </div>
    
    <div class="status-bar">ProtoWebchat™ 1.0 | Visitor #99999 | Online</div>
  </div>

  <script>
    const modeEl = document.getElementById('mode');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const out = document.getElementById('output');
    const out2 = document.getElementById('output2');

    let pollInterval = null;
    let pollInterval2 = null;
    let evtSource = null;
    let ws = null;

    function append(data){
      const time = new Date().toLocaleTimeString();
      out.textContent = `[${time}] ` + (typeof data === 'string' ? data : JSON.stringify(data));
    }

    function append2(data){
      const time = new Date().toLocaleTimeString();
      out2.textContent = `[${time}] ` + (typeof data === 'string' ? data : JSON.stringify(data));
    }

    async function startPolling(){
      async function refresh(){
        try{
          const r = await fetch('user1.txt', { cache: 'no-store' });
          if(!r.ok) throw new Error(r.status);
          const t = await r.text();
          append(t || '(empty)');
        } catch(e){
          append('poll error: ' + e.message);
        }
      }
      await refresh();
      pollInterval = setInterval(refresh, 500);
    }

    async function startPolling2(){
      async function refresh(){
        try{
          const r = await fetch('user2.txt', { cache: 'no-store' });
          if(!r.ok) throw new Error(r.status);
          const t = await r.text();
          append2(t || '(empty)');
        } catch(e){
          append2('poll error: ' + e.message);
        }
      }
      await refresh();
      pollInterval2 = setInterval(refresh, 500);
    }

    function startSSE(){
      evtSource = new EventSource('/events');
      evtSource.onmessage = e => append(e.data);
      evtSource.onerror = () => append('SSE error or disconnected (EventSource will retry)');
    }

    function startWS(){
      ws = new WebSocket('ws://localhost:8080');
      ws.onopen = () => {
        append('ws open');
        ws.send('client connected');
      };
      ws.onmessage = e => append(e.data);
      ws.onclose = () => append('ws closed');
      ws.onerror = () => append('ws error');
    }

    function stopAll(){
      if(pollInterval){ clearInterval(pollInterval); pollInterval = null; append('stopped polling'); }
      if(pollInterval2){ clearInterval(pollInterval2); pollInterval2 = null; append2('stopped polling'); }
      if(evtSource){ evtSource.close(); evtSource = null; append('stopped SSE'); }
      if(ws){ ws.close(); ws = null; append('stopped WS'); }
    }

    startBtn.addEventListener('click', ()=>{
      startBtn.disabled = true; stopBtn.disabled = false; out.textContent = ''; out2.textContent = '';
      const mode = modeEl.value;
      if(mode === 'poll') {
        startPolling();
        startPolling2();
      }
      else if(mode === 'sse') startSSE();
      else if(mode === 'ws') startWS();
    });

    stopBtn.addEventListener('click', ()=>{
      stopAll(); startBtn.disabled = false; stopBtn.disabled = true;
    });
  </script>
  <!-- Created with Microsoft FrontPage 98 - ProtoWebchat(tm) 1999 -->
</body>
</html>
