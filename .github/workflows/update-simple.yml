name: Update simple.txt

# Allow manual trigger from the Actions tab
on:
  workflow_dispatch:

jobs:
  update-simple:
    runs-on: ubuntu-latest
    steps:
      # Check out the repo so we can edit files
      - uses: actions/checkout@v3

      # Update simple.txt with a hardcoded message
      - name: Update simple.txt
        run: |
          MESSAGE="Push via workflows test 1"
          echo "$MESSAGE" > simple.txt
          echo "✓ Updated simple.txt with: $MESSAGE"

      # Commit and push the changes
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simple.txt
          git commit -m "chore: update simple.txt via workflow"
          git push
