<!DOCTYPE html>
<html>
<head>
    <title>RBMK Reactor Simulator</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f0f0; }
        #display { background: white; padding: 20px; border: 1px solid #ccc; margin-bottom: 20px; white-space: pre; }
        button { padding: 10px 15px; margin: 5px; font-family: monospace; font-size: 12px; cursor: pointer; }
        .section { margin: 20px 0; }
        h2 { background: #333; color: white; padding: 10px; }
    </style>
</head>
<body>

<h1>RBMK-1000 Reactor Simulator</h1>

<div id="display"></div>

<div class="section">
    <h2>Control</h2>
    <button onclick="start()">START Reactor</button>
    <button onclick="shutdown()">SHUTDOWN</button>
    <button onclick="scram()">SCRAM (Emergency)</button>
    <button onclick="reset()">RESET All</button>
</div>

<div class="section">
    <h2>Control Rods (0-100, higher = inserted)</h2>
    <button onclick="rodPosition('all', 0)">Pull All Out</button>
    <button onclick="rodPosition('all', 50)">Half Out</button>
    <button onclick="rodPosition('all', 100)">Insert All</button>
    <br><br>
    <button onclick="rodPosition(0, Math.max(0, state.rods[0]-10))">Rod 1 UP</button>
    <button onclick="rodPosition(1, Math.max(0, state.rods[1]-10))">Rod 2 UP</button>
    <button onclick="rodPosition(2, Math.max(0, state.rods[2]-10))">Rod 3 UP</button>
    <button onclick="rodPosition(3, Math.max(0, state.rods[3]-10))">Rod 4 UP</button>
    <button onclick="rodPosition(4, Math.max(0, state.rods[4]-10))">Rod 5 UP</button>
    <button onclick="rodPosition(5, Math.max(0, state.rods[5]-10))">Rod 6 UP</button>
    <button onclick="rodPosition(6, Math.max(0, state.rods[6]-10))">Rod 7 UP</button>
    <button onclick="rodPosition(7, Math.max(0, state.rods[7]-10))">Rod 8 UP</button>
    <br><br>
    <button onclick="rodPosition(0, Math.min(100, state.rods[0]+10))">Rod 1 DOWN</button>
    <button onclick="rodPosition(1, Math.min(100, state.rods[1]+10))">Rod 2 DOWN</button>
    <button onclick="rodPosition(2, Math.min(100, state.rods[2]+10))">Rod 3 DOWN</button>
    <button onclick="rodPosition(3, Math.min(100, state.rods[3]+10))">Rod 4 DOWN</button>
    <button onclick="rodPosition(4, Math.min(100, state.rods[4]+10))">Rod 5 DOWN</button>
    <button onclick="rodPosition(5, Math.min(100, state.rods[5]+10))">Rod 6 DOWN</button>
    <button onclick="rodPosition(6, Math.min(100, state.rods[6]+10))">Rod 7 DOWN</button>
    <button onclick="rodPosition(7, Math.min(100, state.rods[7]+10))">Rod 8 DOWN</button>
</div>

<div class="section">
    <h2>Cooling System</h2>
    <button onclick="togglePump(0)">Pump 1: <span id="pump0">OFF</span></button>
    <button onclick="togglePump(1)">Pump 2: <span id="pump1">OFF</span></button>
    <button onclick="togglePump(2)">Pump 3: <span id="pump2">OFF</span></button>
    <button onclick="togglePump(3)">Pump 4: <span id="pump3">OFF</span></button>
</div>

<div class="section">
    <h2>Systems</h2>
    <button onclick="toggleValve('relief')">Relief Valve: <span id="relief">CLOSED</span></button>
    <button onclick="toggleValve('letdown')">Letdown Valve: <span id="letdown">OPEN</span></button>
    <button onclick="toggleSafety()">Safety System: <span id="safety">ON</span></button>
</div>

<script>
let state = {
    power: 0,
    temp: 270,
    pressure: 70,
    rods: [50, 50, 50, 50, 50, 50, 50, 50],
    pumps: [0, 0, 0, 0],
    relief: 0,
    letdown: 1,
    safety: 1,
    scram: 0,
    running: 0,
    time: 0
};

let lastTime = Date.now();

function updatePhysics() {
    let now = Date.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    
    if (dt > 0.1) dt = 0.1;
    if (!state.running) return;
    
    // Calculate average rod position (0-100)
    let avgRod = state.rods.reduce((a,b) => a+b) / 8;
    
    // Rod effect: 0% inserted = 100% reactivity, 100% inserted = 0% reactivity
    let rodEffect = (100 - avgRod) / 100;
    
    // Power growth rate depends on rod position
    let growthRate = rodEffect * 0.15;
    
    // Update power
    state.power = state.power * (1 + growthRate * dt);
    if (state.power < 0) state.power = 0;
    if (state.power > 1200) state.power = 1200;
    
    // Temperature rises with power
    let tempGain = (state.power / 1000) * 60 * dt;
    
    // Cooling from pumps
    let pumpsOn = state.pumps.reduce((a,b) => a+b);
    let cooling = pumpsOn * 50 * dt;
    
    state.temp = state.temp + tempGain - cooling;
    if (state.temp < 270) state.temp = 270;
    if (state.temp > 350) state.temp = 350;
    
    // Pressure rises with temperature
    let pressureGain = 0;
    if (state.temp > 280) {
        pressureGain = (state.temp - 280) * 0.3 * dt;
    }
    
    // Relief valve reduces pressure
    let pressureRelief = state.relief ? 25 * dt : 0;
    
    state.pressure = state.pressure + pressureGain - pressureRelief;
    if (state.pressure < 50) state.pressure = 50;
    if (state.pressure > 100) state.pressure = 100;
    
    // Safety scram
    if (state.safety && (state.temp > 320 || state.pressure > 95)) {
        state.scram = 1;
        // Auto-insert all rods
        for (let i = 0; i < 8; i++) {
            state.rods[i] = Math.min(100, state.rods[i] + 15);
        }
        state.power *= 0.8;
    }
    
    state.time += dt;
    
    // Shutdown if no power
    if (state.power < 1) {
        state.running = 0;
    }
}

function display() {
    updatePhysics();
    
    let pct = Math.min(100, state.power / 12);
    let bar = '█'.repeat(Math.floor(pct / 5)) + '░'.repeat(20 - Math.floor(pct / 5));
    
    let tpct = Math.max(0, Math.min(100, (state.temp - 270) / 80 * 100));
    let tbar = '█'.repeat(Math.floor(tpct / 5)) + '░'.repeat(20 - Math.floor(tpct / 5));
    
    let ppct = Math.max(0, Math.min(100, (state.pressure - 50) / 50 * 100));
    let pbar = '█'.repeat(Math.floor(ppct / 5)) + '░'.repeat(20 - Math.floor(ppct / 5));
    
    let rodsDisplay = '┌───────────────┐\n│ ROD POSITIONS │\n├───────────────┤\n│';
    for (let i = 0; i < 8; i++) {
        let r = state.rods[i];
        if (r < 25) rodsDisplay += '░';
        else if (r < 50) rodsDisplay += '▒';
        else if (r < 75) rodsDisplay += '▓';
        else rodsDisplay += '█';
    }
    rodsDisplay += '│\n├───────────────┤\n│';
    for (let i = 1; i <= 8; i++) {
        rodsDisplay += i;
    }
    rodsDisplay += '│\n└───────────────┘';
    
    let alarm = '✓ OK';
    if (state.scram) alarm = '⚠ SCRAM ACTIVE!';
    else if (state.temp > 310) alarm = '⚠ HIGH TEMP';
    else if (state.pressure > 85) alarm = '⚠ HIGH PRESSURE';
    else if (pumpsOn === 0 && state.running) alarm = '⚠ NO COOLING';
    
    let pumpsOn = state.pumps.reduce((a,b) => a+b);
    
    let display = `
════════════════════════════════════════════════════════════
                   RBMK-1000 REACTOR
════════════════════════════════════════════════════════════

STATUS: ${state.running ? 'RUNNING' : 'OFFLINE'}  |  SCRAM: ${state.scram ? 'YES' : 'NO'}  |  TIME: ${state.time.toFixed(1)}s

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

POWER OUTPUT:
  ${bar}  ${state.power.toFixed(0)} MW

CORE TEMPERATURE:
  ${tbar}  ${state.temp.toFixed(0)}°C

SYSTEM PRESSURE:
  ${pbar}  ${state.pressure.toFixed(0)} Bar

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

${rodsDisplay}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

COOLING:        Pumps: ${pumpsOn}/4
RELIEF VALVE:   ${state.relief ? 'OPEN' : 'CLOSED'}
LETDOWN VALVE:  ${state.letdown ? 'OPEN' : 'CLOSED'}
SAFETY SYSTEM:  ${state.safety ? 'ON' : 'OFF'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

ALARMS: ${alarm}

════════════════════════════════════════════════════════════
`;
    
    document.getElementById('display').textContent = display;
    
    // Update pump indicators
    for (let i = 0; i < 4; i++) {
        document.getElementById('pump' + i).textContent = state.pumps[i] ? 'ON' : 'OFF';
    }
    document.getElementById('relief').textContent = state.relief ? 'OPEN' : 'CLOSED';
    document.getElementById('letdown').textContent = state.letdown ? 'OPEN' : 'CLOSED';
    document.getElementById('safety').textContent = state.safety ? 'ON' : 'OFF';
}

function start() {
    if (!state.running) {
        state.running = 1;
        state.scram = 0;
        state.power = 50;
        display();
    }
}

function shutdown() {
    state.running = 0;
    state.power = 0;
    display();
}

function scram() {
    state.scram = 1;
    for (let i = 0; i < 8; i++) {
        state.rods[i] = 100;
    }
    display();
}

function reset() {
    state = {
        power: 0,
        temp: 270,
        pressure: 70,
        rods: [50, 50, 50, 50, 50, 50, 50, 50],
        pumps: [0, 0, 0, 0],
        relief: 0,
        letdown: 1,
        safety: 1,
        scram: 0,
        running: 0,
        time: 0
    };
    lastTime = Date.now();
    display();
}

function rodPosition(index, position) {
    if (index === 'all') {
        for (let i = 0; i < 8; i++) {
            state.rods[i] = position;
        }
    } else {
        state.rods[index] = Math.max(0, Math.min(100, position));
    }
    display();
}

function togglePump(index) {
    state.pumps[index] = state.pumps[index] ? 0 : 1;
    display();
}

function toggleValve(valve) {
    if (valve === 'relief') {
        state.relief = state.relief ? 0 : 1;
    } else if (valve === 'letdown') {
        state.letdown = state.letdown ? 0 : 1;
    }
    display();
}

function toggleSafety() {
    state.safety = state.safety ? 0 : 1;
    display();
}

// Start animation loop
setInterval(display, 100);
display();
</script>

</body>
</html>
